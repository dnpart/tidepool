// existing renders each started their React ids at :R0:, so give every one its own
let n = 0;
for (const k of Object.keys(EXISTING)) EXISTING[k] = EXISTING[k].replace(/:R([0-9a-zA-Z]*):/g, (_, a) => `ex${n}${a}`), n++;

  ['lagoon', 'Lagoon', '#E4F3F0', '#0D1A2B'], ['coral', 'Coral Reef', '#FDEEE8', '#1D1326'], ['winter', 'Winter', '#E8F1F8', '#0B1521'],

];
const DECKROWS = [['sea', 'Octo + Manta'], ['arctic', 'Fox + Owl'], ['honey', 'Bee + Sloth'], ['wood', 'Mushroom + Moth']];
const OLD = { sea: { lagoon: ['tide', 'Night tide'], coral: ['garden', 'Coral garden'], winter: ['starry', 'Starry sea'] }, arctic: { lagoon: ['aurora', 'Northern lights'], coral: ['knit', 'Winter knit'], winter: ['snowfall', 'Snowfall'] } };

  }
