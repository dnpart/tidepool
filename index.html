<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173B47" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tidepool" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Tidepool</title>
    <script>
      // Paint the saved background before the app loads, so dark mode never flashes light
      try {
        var s = JSON.parse(localStorage.getItem('tidepool.settings') || '{}');
        var bg = { lagoon: { light: '#E4F3F0', dark: '#0D1A2B' }, coral: { light: '#FDEEE8', dark: '#1D1326' } };
        document.documentElement.style.setProperty('--bg', bg[s.palette || 'lagoon'][s.mode || 'light']);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
